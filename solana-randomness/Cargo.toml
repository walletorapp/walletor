[package]
name = "walletor-randomness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "walletor_randomness"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
ephemeral-vrf-sdk = { version = "=0.17.2", features = ["anchor"] }

[dev-dependencies]
litesvm = "=0.12.0"
solana-account = "3.4"
solana-address = "2.0"
solana-instruction = "3.0"
solana-keypair = "3.1"
solana-message = "3.0"
solana-signer = "3.0"
solana-transaction = "3.0"

[profile.release]
opt-level = "z"
strip = true
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace]
